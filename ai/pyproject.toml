[project]
name = "cv-functions-softsync-ai"
version = "0.1.0"
description = "FastAPI AI service for CV-JD matching"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "PyMuPDF",
    "openai",
    "torch==2.3.1+cpu",
    "numpy<2",
    "transformers==4.44.2",
    "sentence-transformers==3.0.1",
    "accelerate>=0.26.0,<1.0",
    "onnxruntime",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python download_model.py"